[package]
name = "dukto"
version = "0.1.0"
edition = "2021"
default-run = "dukto"
description = "Cross-platform file transfer"

[lib]
name = "dukto_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "dukto"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "dukto-cli"
path = "src/cli/main.rs"
required-features = ["cli"]

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-os = { version = "2", optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-updater = { version = "2.11", optional = true }
tauri-plugin-process = { version = "2.3", optional = true }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
whoami = "1"
dashmap = "6"
mdns-sd = "0.12"
quinn = "0.11"
snow = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
dirs = "6"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[features]
cli = []
default = ["desktop", "custom-protocol"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-notification", "dep:tauri-plugin-os", "dep:tauri-plugin-shell", "dep:tauri-plugin-updater", "dep:tauri-plugin-process"]
custom-protocol = ["desktop", "tauri/custom-protocol"]
