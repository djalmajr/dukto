[package]
name = "dukto"
version = "0.2.2"
edition = "2021"
default-run = "dukto"
description = "Cross-platform file transfer"

[lib]
name = "dukto_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "dukto"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "dukto-cli"
path = "src/cli/main.rs"
required-features = ["cli"]

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-os = { version = "2", optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-updater = { version = "2.11", optional = true }
tauri-plugin-process = { version = "2.3", optional = true }
tauri-plugin-deep-link = { version = "2", optional = true }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
whoami = "1"
dashmap = "6"
mdns-sd = "0.12"
quinn = "0.11"
snow = "0.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
dirs = "6"
ring = "0.17"
spake2 = "0.4"
iroh = { version = "1.2", default-features = false, features = ["tls-ring"] }
zeroize = "1"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
dukto-admission = { path = "../crates/dukto-admission" }

[dev-dependencies]
iroh = { version = "1.2", default-features = false, features = ["test-utils", "tls-ring"] }
tauri = { version = "2", features = ["test"] }

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-ui-kit = { version = "0.3", default-features = false, features = ["UIApplication", "UIDevice"] }
zeroconf = "0.18"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[features]
cli = []
default = ["desktop", "custom-protocol"]
app-common = [
	"dep:tauri",
	"dep:tauri-build",
	"dep:tauri-plugin-dialog",
	"dep:tauri-plugin-notification",
	"dep:tauri-plugin-os",
	"dep:tauri-plugin-shell",
	"dep:tauri-plugin-process",
	"dep:tauri-plugin-deep-link",
]
desktop = ["app-common", "dep:tauri-plugin-updater"]
mobile = ["app-common"]
custom-protocol = ["desktop", "tauri/custom-protocol"]
