<!doctype html>
<html lang="en">
 <head>
  <meta charset="UTF-8" />
  <script>
   (() => {
    let theme;
    try { theme = localStorage.getItem("dukto-site-theme"); } catch {}
    document.documentElement.dataset.theme = theme === "dark" || theme === "light" ? theme : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
   document.documentElement.dataset.kbTheme = document.documentElement.dataset.theme;
   })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Files and folders between macOS, Windows, Linux, Android, and iOS, directly between your devices. Explore Dukto, its documentation, and the CLI." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="canonical" href="https://dukto.app/" />
  <title>Dukto — Your files, right there.</title>
 </head>
 <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
