[package]
name = "dukto-gateway"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
dukto-admission = { path = "../../crates/dukto-admission" }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
