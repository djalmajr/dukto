name: Build installers (manual)
on:
  workflow_dispatch:
    inputs:
      notarize_macos:
        description: Sign and notarize macOS apps (requires Apple secrets)
        type: boolean
        default: true
      create_release_draft:
        description: Create a GitHub release draft after all builds (only after review)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate-release-request:
    runs-on: ubuntu-latest
    steps:
      - name: Require main for installer signing
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
            echo "::error::Installer signing may only run from refs/heads/main"
            exit 1
          fi
  build:
    needs: validate-release-request
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - run: bun install --frozen-lockfile
      - name: Require the updater signing key when updater artifacts are enabled
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const config = JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json", "utf8"));
          if (config.bundle?.createUpdaterArtifacts && !process.env.TAURI_SIGNING_PRIVATE_KEY) {
            console.error("::error::TAURI_SIGNING_PRIVATE_KEY is required when createUpdaterArtifacts is enabled");
            process.exit(1);
          }
          NODE
      - run: bun run site:check
      - name: Test core including network discovery
        if: runner.os != 'macOS'
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - name: Test macOS core without hosted-runner multicast discovery
        if: runner.os == 'macOS'
        # Hosted macOS cannot resolve even its own mDNS announcement. These LAN
        # integration tests still run on Linux/Windows and on the local macOS lab.
        run: >-
          cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked --
          --skip discovery::mdns::tests::raw_mdns_register_and_browse
          --skip discovery::mdns::tests::register_and_browse_finds_peer
          --skip discovery::mdns::tests::explicit_shutdown_announces_peer_removal
          --skip discovery::mdns::tests::discovers_peer_arriving_after_thirty_seconds
          --skip discovery::mdns::tests::does_not_discover_self_via_broadcast
      - run: bun test
      - name: Prepare Apple notarization key
        if: runner.os == 'macOS' && inputs.notarize_macos
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8_BASE64; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required secret is missing: $name"
              exit 1
            fi
          done
          umask 077
          python3 - <<'PYKEY'
          import base64, os, pathlib
          key = base64.b64decode("".join(os.environ["APPLE_API_KEY_P8_BASE64"].split()), validate=True)
          pathlib.Path(os.environ["RUNNER_TEMP"], "DuktoAuthKey.p8").write_bytes(key)
          PYKEY
          openssl pkey -in "$RUNNER_TEMP/DuktoAuthKey.p8" -noout
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/DuktoAuthKey.p8" >> "$GITHUB_ENV"
      - name: Build signed and notarized macOS app
        if: runner.os == 'macOS' && inputs.notarize_macos
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: bun run build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify macOS signing and notarization ticket
        if: runner.os == 'macOS' && inputs.notarize_macos
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          app="src-tauri/target/$RUST_TARGET/release/bundle/macos/Dukto.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
      - name: Remove temporary Apple API key
        if: always() && runner.os == 'macOS' && inputs.notarize_macos
        shell: bash
        run: rm -f "$RUNNER_TEMP/DuktoAuthKey.p8"
      - name: Build evaluation or non-macOS installer
        if: runner.os != 'macOS' || !inputs.notarize_macos
        run: bun run build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --no-sign
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Sign updater bundle when --no-sign skipped its signature
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.target }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bundle_root="src-tauri/target/$RUST_TARGET/release/bundle"
          case "$RUST_TARGET" in
            *-apple-darwin) pattern='*.app.tar.gz' ;;
            *-pc-windows-msvc) pattern='*-setup.exe' ;;
            *-unknown-linux-gnu) pattern='*.AppImage' ;;
            *) echo "::error::Unsupported release target: $RUST_TARGET"; exit 1 ;;
          esac
          bundles=()
          while IFS= read -r -d '' bundle; do
            bundles+=("$bundle")
          done < <(find "$bundle_root" -type f -iname "$pattern" -print0)
          if [[ "${#bundles[@]}" -ne 1 ]]; then
            echo "::error::Expected one updater bundle matching $pattern, found ${#bundles[@]}"
            exit 1
          fi
          asset="${bundles[0]}"
          if [[ ! -s "$asset.sig" ]]; then
            if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY is required to sign $asset"
              exit 1
            fi
            umask 077
            key_file="$(mktemp)"
            trap 'rm -f "$key_file"' EXIT
            printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$key_file"
            env -u TAURI_SIGNING_PRIVATE_KEY bunx tauri signer sign \
              --private-key-path "$key_file" \
              --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
              "$asset"
          fi
          if [[ ! -s "$asset.sig" ]]; then
            echo "::error::Updater signature was not produced for $asset"
            exit 1
          fi
      - name: Build CLI
        run: cargo build --manifest-path src-tauri/Cargo.toml --no-default-features --bin dukto-cli --release --locked --target ${{ matrix.target }}
      - name: Collect and checksum
        run: bun run release:collect ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: dukto-${{ matrix.target }}
          path: |
            .cache/release/${{ matrix.target }}/dukto_*
            .cache/release/${{ matrix.target }}/dukto-cli_*
            .cache/release/${{ matrix.target }}/SHA256SUMS-*.txt
          if-no-files-found: error
          include-hidden-files: true
  assemble-updater-feed:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/download-artifact@v4
        with:
          pattern: dukto-*
          path: artifacts
          merge-multiple: true
      - name: Install Minisign verifier
        run: sudo apt-get update && sudo apt-get install --yes minisign
      - name: Test updater signature validation
        run: bun test scripts/generate-updater-manifest.test.mjs
      - name: Generate a complete updater feed for this build run
        run: |
          set -euo pipefail
          VERSION="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          node scripts/generate-updater-manifest.mjs \
            --artifacts-dir artifacts \
            --output artifacts/latest.json \
            --repo "$GITHUB_REPOSITORY" \
            --tag "v$VERSION" \
            --notes-file docs/releases/RELEASE-NOTES.md
      - uses: actions/upload-artifact@v4
        with:
          name: updater-feed
          path: artifacts/latest.json
          if-no-files-found: error
          include-hidden-files: true
  draft:
    if: inputs.create_release_draft
    needs: [build, assemble-updater-feed]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: dukto-*
          path: artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: updater-feed
          path: updater-feed
      - name: Include the already validated updater feed
        run: cp updater-feed/latest.json artifacts/latest.json
      - name: Create reviewable draft only
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_NOTARIZED: ${{ inputs.notarize_macos }}
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          cp docs/releases/RELEASE-NOTES.md release-notes.md
          if [ "$MACOS_NOTARIZED" = "true" ]; then
            printf '\nmacOS desktop apps: Developer ID signed, notarized and ticket validated.\n' >> release-notes.md
          else
            printf '\nmacOS desktop apps: unsigned evaluation build; not notarized.\n' >> release-notes.md
          fi
          gh release create "v$VERSION" artifacts/* --draft --target "$GITHUB_SHA" --title "Dukto $VERSION" --notes-file release-notes.md
