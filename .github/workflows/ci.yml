name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install updater signature verifier
        run: sudo apt-get update && sudo apt-get install -y minisign
      - run: bun install --frozen-lockfile
      - name: Build frontend and generate route types
        run: bun run vite:build
      - run: bun run lint
      - run: bun run site:check
      - run: bun test
      - run: bun run site:build
      - run: node scripts/check-site.mjs
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - run: cargo build --manifest-path src-tauri/Cargo.toml --no-default-features --bin dukto-cli --locked
      - run: node scripts/test-cli.mjs

  desktop-update-guard:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - run: bun run vite:build
      - name: Verify update installation and transfer exclusion
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib transfer::cancellation::tests
